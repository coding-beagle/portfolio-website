[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nt-registry-cli"
version = "1.0.0"
description = "Command line client for a private release registry"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Nicholas Teague" }]
keywords = ["registry", "releases", "artifacts", "auto-update"]

# Two, both ubiquitous and pure Python, so `pip install` needs no compiler and
# no system packages. Everything that touches the network is still stdlib
# (urllib), so these are presentation only.
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
nt = "nt.cli:main"

[tool.setuptools]
packages = ["nt"]

# The integration guide ships with the client so `nt integrate` works from a
# plain `pip install`, with no repository checked out. It is a copy of
# php/registry/INTEGRATION.md; cli/tests/test_integrate.py fails if the two
# ever differ, and `make sync_integration_doc` puts them back in step.
[tool.setuptools.package-data]
nt = ["data/*.md"]
