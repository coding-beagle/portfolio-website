[package]
name = "npaint"
version = "0.1.0"
edition = "2021"
description = "A layer-based image editor that runs in the browser as WebAssembly."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The only dependency. The core (`document`, `raster`, `tools`, ...) is plain
# Rust and never touches it; only `wasm.rs` does, so the whole engine compiles
# and tests natively.
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
